    <div class="main">
        <div class="infoContainer">
            <div class="devInfo">
                <h1>Contact Me</h1>
                <form id="contactForm">
                    <input type="email" name="email" placeholder="Your Email" required>
                    <input type="text" name="phone" placeholder="Your Phone">
                    <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                    <div class="buttons">
                        <button type="submit" class="btn">Send Message</button>
                    </div>
                </form>

                <div class="extraContactInfo">
                    <p><strong>Phone:</strong> <a href="tel:+9779767462603">+977 9767462603</a></p>

                    <p><strong>Facebook:</strong> <a href="https://www.facebook.com/" target="_blank">facebook.com/mamata.pant</a></p>
                </div>

                <div class="subscribeBox">
                    <h3>Subscribe for Updates</h3>
                    <p>Get notified about my new projects and professional updates.</p>
                    <form id="subscribeForm">
                        <input type="email" name="email" placeholder="Enter your email" required>
                        <button type="submit" class="btn">Subscribe</button>
                    </form>
                </div>

            </div>
        </div>
